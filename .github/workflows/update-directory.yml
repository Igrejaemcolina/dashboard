name: Update directory export

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Generate directory JSON
        run: node scripts/export-directory.js
      - name: Commit updated directory
        run: |
          if git status --porcelain data/directory.json | grep -q '^'; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/directory.json
            git commit -m "Update directory export"
            git push
          else
            echo "No changes to commit"
          fi
