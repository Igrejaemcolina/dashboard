<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 140" role="img" aria-labelledby="title desc">
  <title id="title">Flowmetrics</title>
  <desc id="desc">Bar chart with flowing lines inspired by the Flowmetrics brand</desc>
  <defs>
    <linearGradient id="flowmetricsGradient" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#00b7ff" />
      <stop offset="100%" stop-color="#6940ff" />
    </linearGradient>
  </defs>
  <rect width="320" height="140" fill="none" rx="16" ry="16" />
  <g fill="url(#flowmetricsGradient)">
    <rect x="40" y="36" width="28" height="64" rx="6" />
    <rect x="86" y="20" width="28" height="80" rx="6" />
    <rect x="132" y="52" width="28" height="48" rx="6" />
    <rect x="178" y="8" width="28" height="92" rx="6" />
  </g>
  <path
    d="M24 100c30 12 56 12 86 0s56-12 86 0 56 12 86 0"
    fill="none"
    stroke="url(#flowmetricsGradient)"
    stroke-width="12"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <text x="24" y="128" font-family="'Montserrat', 'Segoe UI', sans-serif" font-size="36" font-weight="700" fill="#ffffff">
    Flowmetrics
  </text>
  <text x="246" y="132" font-family="'Montserrat', 'Segoe UI', sans-serif" font-size="16" font-weight="600" fill="#ffffff">
    by Jonh's
  </text>
</svg>
