<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Instalador · Dados da IGColina</title>
    <link rel="stylesheet" href="installer.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body data-page="installer">
    <div class="installer-shell">
      <aside class="installer-sidebar" aria-label="Progresso do instalador">
        <div class="installer-logo">
          <span class="installer-logo-mark" aria-hidden="true">IG</span>
          <div class="installer-logo-text">
            <span class="installer-logo-title">IGColina</span>
            <span class="installer-logo-subtitle">Assistente de instalação</span>
          </div>
        </div>
        <ol class="installer-steps" id="installer-steps"></ol>
        <div class="installer-sidebar-footer">
          <p>
            Use este assistente para gerar um pacote configurável da dashboard.
          </p>
          <p class="installer-sidebar-tip">
            Todas as senhas são protegidas automaticamente com SHA-256.
          </p>
        </div>
      </aside>
      <main class="installer-main" id="installer" aria-live="polite">
        <header class="installer-header">
          <div>
            <h1 id="installer-step-title">Bem-vindo</h1>
            <p id="installer-step-description"></p>
          </div>
          <div class="installer-actions">
            <button type="button" class="ghost" id="installer-back" disabled>
              Voltar
            </button>
            <button type="button" id="installer-next">Próximo</button>
          </div>
        </header>
        <section class="installer-content" id="installer-content"></section>
      </main>
    </div>
    <template id="service-row-template">
      <li class="installer-card" data-service-id="">
        <div class="installer-card-text">
          <strong class="installer-card-title"></strong>
          <span class="installer-card-meta"></span>
        </div>
        <div class="installer-card-actions">
          <button type="button" data-action="edit">Editar</button>
          <button type="button" class="danger" data-action="remove">Excluir</button>
        </div>
      </li>
    </template>
    <template id="role-row-template">
      <li class="installer-card" data-role-id="">
        <div class="installer-card-text">
          <strong class="installer-card-title"></strong>
          <span class="installer-card-meta"></span>
        </div>
        <div class="installer-card-actions">
          <button type="button" data-action="edit">Editar</button>
          <button type="button" class="danger" data-action="remove">Excluir</button>
        </div>
      </li>
    </template>
    <script src="installer.js" type="module"></script>
  </body>
</html>
